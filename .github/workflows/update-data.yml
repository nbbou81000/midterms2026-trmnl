name: Mise à jour des données midterms

on:
  # Bouton "Run workflow" dans l'onglet Actions de GitHub (déclenchement
  # manuel, pratique pour la première exécution ou pour forcer une mise
  # à jour immédiate).
  workflow_dispatch: {}

  # Déclenchement automatique natif GitHub — toutes les heures. Le script
  # ne commite de toute façon que si les données ont réellement changé.
  schedule:
    - cron: "27 * * * *"

  # Pratique si tu modifies le script directement depuis l'éditeur GitHub.
  push:
    branches: [main]
    paths:
      - "scripts/fetch-midterms-data.js"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Récupérer et agréger les données midterms
        run: node scripts/fetch-midterms-data.js

      - name: Committer si les données ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/midterms.json
          if git diff --cached --quiet; then
            echo "Rien de neuf — pas de commit."
          else
            git commit -m "Mise à jour automatique des données midterms"
            git push
          fi
